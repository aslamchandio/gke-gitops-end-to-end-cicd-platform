apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1-deployment
  namespace: dev-ns
  labels:
    app: myapp1-pod
spec:
  template:
    spec:
      containers:
      - name: myapp1-container
        resources:
          requests:
            memory: "40Mi"
            cpu: "40m"
          limits:
            memory: "50Mi"
            cpu: "50m"
